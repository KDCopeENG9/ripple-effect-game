<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Ripple Effect — Team Challenge V2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f3e9;background:#10272b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#2a5552,transparent 45%),#10272b}main{max-width:1100px;margin:auto;padding:20px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #64817b;padding-bottom:15px}.eyebrow{font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;color:#f2d68d}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(2.1rem,5vw,3.5rem);margin:12px 0}h2{font-size:1.7rem}p{line-height:1.55}.panel{border:1px solid #678981;border-radius:16px;background:#1b3a3d;padding:24px;margin-top:20px}.muted{color:#c5d4ce}.pill{border:1px solid #819f94;border-radius:99px;padding:8px 12px;font-size:.85rem}.btn{background:#f1cc77;color:#13292a;border:0;border-radius:9px;padding:13px 18px;font:700 1rem system-ui;cursor:pointer}.btn:hover{background:#ffe1a1}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#31545a;color:#fff;border:1px solid #98b9b0}.bar{height:9px;border-radius:9px;background:#496568;margin:18px 0;overflow:hidden}.fill{height:100%;background:#f1cc77;transition:width .2s}.task{padding:17px;background:#102d32;border-radius:10px;border-left:4px solid #f1cc77;margin:14px 0}.board{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid #78958c;background:#26494d;border-radius:11px;padding:15px;margin:10px 0}.card strong{color:#f5d58c}.small{font-size:.86rem}.tag{font-size:.74rem;color:#f1d388;text-transform:uppercase;letter-spacing:.1em}.select,input,textarea{width:100%;background:#102a30;color:white;border:1px solid #a4bdb4;border-radius:8px;padding:11px;font:inherit;margin-top:8px}textarea{min-height:105px}.feedback{border-left:4px solid #f1cc77;background:#315255;border-radius:8px;padding:14px;margin:16px 0}.choice{display:block;border:1px solid #78958c;background:#234449;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.choice:has(input:checked){border-color:#f1cc77;background:#3b554c}.choice input{width:auto;margin:0 9px 0 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.foot{font-size:.8rem;color:#b6c8c1;margin:28px 0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f1cc77;outline-offset:3px}@media(max-width:700px){.board,.grid{grid-template-columns:1fr}.panel{padding:16px}main{padding:12px}}</style></head><body><main><header><div><div class="eyebrow">Island Anthropologist Field Study</div><strong>THE RIPPLE EFFECT · V2</strong></div><div class="row"><span class="pill" id="teamLabel">Expedition Team</span><span class="pill" id="scoreLabel">0 points</span></div></header><div class="bar"><div class="fill" id="progress"></div></div><section id="app"></section><div class="foot">For Chapters 1–4 of <em>Lord of the Flies</em>. No logins or internet connection needed after loading. Team work stays on this device. The final report can be printed or copied.</div></main><script>
const $=s=>document.querySelector(s), app=$('#app');let team='',stage=-1,score=0,roundScore=[],rows=[],tries=0,locked=false,feedback='',factor='',chosen=[],reason='',claim='';
const rounds=[
{title:'Everyday Life',lead:'The same situation can have a direct effect and a bigger ripple effect. Match each decision with the BEST next event. Several choices sound reasonable.',label:'Decision',other:'What happens next?',pairs:[
['Four friends have $40 for rides. One friend spends $25 on games.','The group has only $15 left and cannot buy the planned $24 in ride tickets.'],
['Two students skip meetings for a group project.','The other members must take on more of the work.'],
['Someone shares a private message without permission.','The message reaches people it was not meant for.'],
['A student stays up until 2 a.m. before a test.','The student arrives at school with very little sleep.'],
['A team changes its practice schedule.','The team practices at different times than before.'],
['Friends agree on a budget before a trip.','They have a shared plan for how much they can spend.']],extras:['The friends definitely stop speaking to each other.','The student is guaranteed to fail the test.','The team wins every game from now on.'],deep:{question:'Which explanation is the MOST careful?',options:['The new practice schedule caused the team to win its next game.','The schedule may have helped the team win, but other things could have mattered too.','The practice schedule had nothing to do with the game.'],answer:1,why:'One change can help cause an outcome, but it may not be the only cause.'}},
{title:'The Brent Bishop Files',lead:'A choice can cause something else, and that result can start a new chain. Match each event with the BEST next effect.',label:'Event or decision',other:'What follows?',pairs:[
['Brent is humiliated at the party and leaves upset.','His emotional distress becomes part of the events leading to his dangerous decision to drive.'],
['Brent drives while intoxicated and causes a crash.','Lea dies, and Brent must face the harm he caused.'],
['Lea’s mother asks Brent to make four whirligigs.','Brent begins a journey to create them in different places.'],
['Brent travels and meets unfamiliar people.','He encounters new ways of thinking about himself and others.'],
['Brent places whirligigs far from home.','People he may never meet can be affected by his creations.'],
['Brent tries to take responsibility for his actions.','He begins to change, although the harm cannot be undone.']],extras:['The crash becomes unimportant once Brent starts traveling.','Everyone who sees a whirligig learns Brent’s whole story.','Brent’s feelings make his decision to drive unavoidable.'],deep:{question:'Which statement BEST explains Brent’s responsibility?',options:['Feeling humiliated explains why Brent was upset, but it does not excuse driving intoxicated.','Because Brent was upset, someone else is responsible for the crash.','Brent’s journey completely erases the harm from the crash.'],answer:0,why:'A feeling may help explain a choice without excusing it.'}},
{title:'Island Crisis',lead:'Some answers describe a direct result. Others describe a larger problem. Find the BEST connection using Chapters 1–4.',label:'Event',other:'Best direct effect',pairs:[
['Ralph uses the conch to call the boys together.','The boys gather and begin organizing themselves.'],
['The boys agree to rules for speaking in meetings.','The conch gives them a way to take turns and keep order.'],
['Many boys stop helping Ralph and Simon build shelters.','Most of the shelter work falls to just two boys.'],
['Jack’s hunters leave the signal fire unattended.','A passing ship does not see their signal, and they miss a rescue chance.'],
['Ralph criticizes Jack for neglecting the fire.','The disagreement about rescue and hunting becomes more intense.'],
['Piggy criticizes the hunters after the missed rescue.','Jack strikes Piggy and breaks one lens of his glasses.']],extras:['The boys immediately agree that hunting matters more than rescue.','The conch prevents all future arguments.','The boys decide to leave the island by boat.'],deep:{question:'What is the BEST explanation of the missed rescue chance?',options:['Jack cares more about hunting than Ralph does.','The hunters leave the fire, so there is no signal when the ship passes.','Ralph and Jack have different ideas about leadership.'],answer:1,why:'The other answers describe bigger issues. Leaving the fire is the direct cause of the missed signal.'}}
];
const factors=['Failure to share responsibilities','Competition between leaders','Fear and uncertainty','Ignoring rules'];
const evidence=[
{t:'Most boys leave the shelter work to Ralph and Simon.',f:[0,3]},
{t:'Jack’s hunters leave the signal fire to hunt.',f:[0,1,3]},
{t:'Ralph and Jack argue about rescue and hunting.',f:[0,1]},
{t:'The littluns are frightened by talk of a beast.',f:[2]},
{t:'The boys often ignore the speaking rules at assemblies.',f:[3,0]},
{t:'Jack hits Piggy after Piggy criticizes the hunters.',f:[1,3]},
{t:'The boys choose Ralph as chief at the first meeting.',f:[]},
{t:'The boys explore the island after arriving.',f:[]}
];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){return [...a].map(v=>({v,k:Math.random()})).sort((a,b)=>a.k-b.k).map(x=>x.v)}function update(){ $('#teamLabel').textContent=team||'Expedition Team';$('#scoreLabel').textContent=score+' points';$('#progress').style.width=Math.max(0,Math.min(100,(stage+1)/5*100))+'%'}
function start(){team=$('#team').value.trim().slice(0,55);if(!team){$('#team').focus();return}stage=0;openRound()}
function intro(){stage=-1;update();app.innerHTML=`<div class="panel"><div class="eyebrow">Team investigation</div><h1>Every choice starts a chain.</h1><p>Work together to connect decisions, events, and effects. The choices will get harder as you go.</p><div class="task"><strong>Team rules</strong><p>Everyone shares an idea before the team submits. Switch who controls the Chromebook after each round. You get one chance at full points, then you can fix your work.</p></div><label for="team">Expedition Team name</label><input id="team" maxlength="55" placeholder="Enter your team name"><p><button class="btn" onclick="start()">Begin investigation →</button></p></div>`}
function openRound(){tries=0;locked=false;feedback='';const r=rounds[stage];const order=shuffle(r.pairs.map((p,i)=>({i,p})));const pool=shuffle([...r.pairs.map((p,i)=>({id:i,text:p[1]})),...r.extras.map((text,i)=>({id:'x'+i,text}))]);window.current={order,pool};rows=Array(r.pairs.length).fill('');window.deepChoice='';drawRound()}
function drawRound(){update();const r=rounds[stage],c=window.current;app.innerHTML=`<div class="panel"><div class="eyebrow">Round ${stage+1} of 3</div><h2>${esc(r.title)}</h2><p>${esc(r.lead)}</p><div class="task"><strong>Match all six.</strong> Each effect can be used once. Three cards do not belong anywhere. Talk before you submit.</div><div class="board"><div><div class="tag">${esc(r.label)}</div>${c.order.map((o,i)=>`<div class="card"><strong>${i+1}.</strong> ${esc(o.p[0])}<label class="small" for="s${i}">Choose the best effect</label><select class="select" id="s${i}" onchange="rows[${i}]=this.value;feedback='';document.getElementById('roundFeedback').innerHTML=''" ${locked?'disabled':''}><option value="">Select an effect…</option>${c.pool.map((v,j)=>`<option value="${esc(String(v.id))}" ${rows[i]===String(v.id)?'selected':''}>${j+1}. ${esc(v.text)}</option>`).join('')}</select></div>`).join('')}</div><div><div class="tag">Effect cards · shared pool</div>${c.pool.map((v,j)=>`<div class="card"><strong>Card ${j+1}</strong>${esc(v.text)}</div>`).join('')}</div></div><div id="roundFeedback">${feedback}</div><button class="btn" id="check" ${rows.some(x=>x==='')||locked?'disabled':''} onclick="checkRound()">Submit all six matches</button></div>`;document.querySelectorAll('select').forEach(el=>el.addEventListener('change',()=>{$('#check').disabled=rows.some(x=>x==='')}))}
function checkRound(){const c=window.current;tries++;let correct=0;const unique=new Set(rows).size===rows.length;c.order.forEach((o,i)=>{if(rows[i]===String(o.i))correct++});if(correct===6&&unique){const pts=tries===1?12:tries===2?9:6;score+=pts;roundScore[stage]=pts;locked=true;feedback=`<div class="feedback"><strong>All six connections work!</strong> +${pts} points. ${tries===1?'First try!':'Good revision.'}</div><button class="btn" onclick="deepQuestion()">Next: explain the thinking →</button>`;drawRound();return}feedback=`<div class="feedback"><strong>${correct} of 6 connections are correct.</strong> ${unique?'Some connections need another look.':'You used at least one effect more than once.'} Talk through the whole set and try again. The correct matches are not shown.</div>`;drawRound()}
function deepQuestion(){const d=rounds[stage].deep;window.deepChoice='';app.innerHTML=`<div class="panel"><div class="eyebrow">Round ${stage+1} · Team reasoning</div><h2>Which explanation is strongest?</h2><div class="task">${esc(d.question)}</div>${d.options.map((o,i)=>`<label class="choice"><input type="radio" name="deep" value="${i}" onchange="window.deepChoice=this.value">${esc(o)}</label>`).join('')}<div id="deepFeedback"></div><button class="btn" onclick="checkDeep()">Submit team answer</button></div>`}
function checkDeep(){const d=rounds[stage].deep;if(window.deepChoice===''){return}const good=Number(window.deepChoice)===d.answer;if(good)score+=4;$('#deepFeedback').innerHTML=`<div class="feedback"><strong>${good?'Strong reasoning! +4 points':'Not the strongest explanation this time.'}</strong><p>${esc(d.why)}</p></div><button class="btn" onclick="advance()">${stage===2?'Final Investigation →':'Next round →'}</button>`;document.querySelectorAll('input[name=deep]').forEach(x=>x.disabled=true);document.querySelector('.panel > button').disabled=true;update()}
function advance(){stage++;if(stage<3)openRound();else finalScreen()}
function finalScreen(){update();app.innerHTML=`<div class="panel"><div class="eyebrow">Final mission · Preview of Progress Report #1</div><h2>What is making the island less stable?</h2><p>Your team must make a claim, choose two events from Chapters 1–4, and explain how those events support your claim. <strong>More than one claim can work.</strong></p><div class="task"><strong>1. Choose the biggest cause.</strong> Which problem has done the most damage to the boys' society so far?</div>${factors.map((f,i)=>`<label class="choice"><input type="radio" name="factor" value="${i}" ${factor===String(i)?'checked':''} onchange="factor=this.value;renderEvidence()">${esc(f)}</label>`).join('')}<div class="task"><strong>2. Choose TWO pieces of evidence.</strong> Pick events that best support your claim. Not every event is equally helpful.</div><div id="evidenceArea"></div><div class="task"><strong>3. Explain your thinking.</strong> How do your two events show that this problem is making the society less stable?</div><textarea id="reason" placeholder="Because… As a result… This shows…" oninput="reason=this.value">${esc(reason)}</textarea><p><button class="btn" onclick="submitFinal()">Submit Final Investigation</button></p><div id="finalFeedback"></div></div>`;renderEvidence()}
function renderEvidence(){const area=$('#evidenceArea');if(!area)return;area.innerHTML=evidence.map((e,i)=>`<label class="choice"><input type="checkbox" value="${i}" ${chosen.includes(i)?'checked':''} onchange="toggleEvidence(${i},this.checked)">${esc(e.t)}</label>`).join('')+`<p class="small muted">Selected: ${chosen.length} of 2</p>`}
function toggleEvidence(i,on){if(on){if(chosen.length>=2){renderEvidence();return}chosen.push(i)}else chosen=chosen.filter(x=>x!==i);renderEvidence()}
function submitFinal(){reason=$('#reason').value.trim();if(factor===''||chosen.length!==2||reason.length<45){$('#finalFeedback').innerHTML='<div class="feedback">Choose a claim, choose exactly two events, and write at least two thoughtful sentences explaining your reasoning.</div>';return}const f=Number(factor);const relevance=chosen.filter(i=>evidence[i].f.includes(f)).length;const note=relevance===2?'Both events are reasonable evidence for your claim.':relevance===1?'One event connects clearly to your claim. Discuss whether the other event really supports it.':'Your events may not clearly support this claim. Reconsider your evidence or your claim.';$('#finalFeedback').innerHTML=`<div class="feedback"><strong>Evidence check:</strong> ${note}<p><strong>Important:</strong> A computer cannot judge whether your written explanation is convincing. Your team should read it aloud and decide whether it connects each event to the claim.</p></div><button class="btn" onclick="finish()">Create Team Field Report →</button>`}
function finish(){stage=4;score+=6;update();const f=factors[Number(factor)];app.innerHTML=`<div class="panel" id="report"><div class="eyebrow">Expedition Team Field Report</div><h1>Investigation complete</h1><p><strong>Team:</strong> ${esc(team)}</p><p><strong>Game points:</strong> ${score} <span class="small muted">(includes 6 points for completing the final report; reasoning needs teacher review)</span></p><h2>Our claim</h2><p>${esc(f)} has contributed most to the island society's instability in Chapters 1–4.</p><h2>Our evidence</h2><p>1. ${esc(evidence[chosen[0]].t)}</p><p>2. ${esc(evidence[chosen[1]].t)}</p><h2>Our explanation</h2><p style="white-space:pre-wrap">${esc(reason)}</p><div class="row"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn secondary" onclick="copyReport()">Copy field report</button><button class="btn secondary" onclick="location.reload()">Start a new team</button></div><p class="muted small">Next: Complete your Cause & Effect Lab independently. Your Progress Report will also need a blended quotation, citations, and a Toolbox word.</p></div>`}
function copyReport(){const text=`The Ripple Effect — Team Field Report\nTeam: ${team}\nPoints: ${score}\nClaim: ${factors[Number(factor)]}\nEvidence 1: ${evidence[chosen[0]].t}\nEvidence 2: ${evidence[chosen[1]].t}\nExplanation: ${reason}`;navigator.clipboard?.writeText(text).then(()=>alert('Field report copied.'),()=>alert('Use Print / Save as PDF instead.'))}
intro();
</script></body></html>
